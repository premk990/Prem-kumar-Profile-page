<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            color: #fff;
            overflow-x: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 2px solid rgba(102, 126, 234, 0.3);
            padding: 30px 20px;
            overflow-y: auto;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: #b0b0b0;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 0.85rem;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.6);
            color: #667eea;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.8);
            color: #667eea;
        }

        .nav-item span {
            font-size: 1.1rem;
        }

        .timezone-list {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .timezone-item {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #a0a0ff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .timezone-item:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .timezone-item .remove {
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .timezone-item .remove:hover {
            opacity: 1;
            color: #ff6b6b;
        }

        .add-timezone-form {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(102, 126, 234, 0.3);
        }

        .timezone-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 0.85rem;
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .timezone-selector:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-add {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            width: 100%;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: rgba(255, 107, 107, 0.3);
        }

        /* Scrollbar styling for sidebar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.4);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.6);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px 20px;
            overflow-y: auto;
            height: 100vh;
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1rem;
            color: #b0b0b0;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .clock-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(102, 126, 234, 0.6);
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(102, 126, 234, 0.4);
        }

        .timezone-name {
            font-size: 1.2rem;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .timezone-info {
            font-size: 0.85rem;
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        .digital-time {
            font-size: 2.5rem;
            color: #00ff88;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            margin-bottom: 15px;
            word-break: break-all;
        }

        .digital-date {
            font-size: 0.95rem;
            color: #a0a0ff;
            text-align: center;
        }

        .controls {
            text-align: center;
            margin-top: 40px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .footer {
            text-align: center;
            color: #b0b0b0;
            margin-top: 50px;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #b0b0b0;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        /* Toggle Sidebar Button (for mobile) */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 2px solid rgba(102, 126, 234, 0.3);
                padding: 20px;
            }

            .main-content {
                margin-left: 0;
                height: auto;
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .digital-time {
                font-size: 1.8rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .sidebar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- Left Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>⏰ Clock Hub</h2>
            <p>Manage your timezones</p>
        </div>

        <!-- Navigation Options -->
        <div class="nav-section">
            <div class="nav-section-title">Navigation</div>
            <div class="nav-item active" onclick="scrollToTop()">
                <span>🏠</span> Home
            </div>
            <div class="nav-item" onclick="showAllClocks()">
                <span>🌍</span> All Timezones
            </div>
            <div class="nav-item" onclick="showFavorites()">
                <span>⭐</span> Favorites
            </div>
        </div>

        <!-- Active Timezones -->
        <div class="nav-section">
            <div class="nav-section-title">Active Timezones</div>
            <div class="timezone-list" id="activeTzList">
                <!-- Active timezones will be listed here -->
            </div>
        </div>

        <!-- Add Timezone Section -->
        <div class="add-timezone-form">
            <div class="nav-section-title">Add Timezone</div>
            <select class="timezone-selector" id="timezoneSelect">
                <option value="">Select timezone...</option>
            </select>
            <button class="btn-add" onclick="addTimezone()">+ Add</button>
            <button class="btn-clear" onclick="clearAllClocks()">Clear All</button>
            <button class="btn-add" style="margin-top: 8px;" onclick="addDefaultClocks()">Reset to Default</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>⏰ Multi-Timezone Clock</h1>
            <p>Real-time clock displaying current time across the globe</p>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clock cards will be generated here -->
        </div>

        <div class="footer">
            <p>💡 Click on any clock card to remove it. Use the left panel to manage your timezones.</p>
        </div>
    </div>

    <script>
        // List of all available timezones
        const timezones = [
            'UTC',
            'America/New_York',
            'America/Chicago',
            'America/Denver',
            'America/Los_Angeles',
            'America/Anchorage',
            'Pacific/Honolulu',
            'Europe/London',
            'Europe/Paris',
            'Europe/Berlin',
            'Europe/Moscow',
            'Asia/Dubai',
            'Asia/Kolkata',
            'Asia/Bangkok',
            'Asia/Singapore',
            'Asia/Hong_Kong',
            'Asia/Tokyo',
            'Asia/Seoul',
            'Australia/Sydney',
            'Australia/Melbourne',
            'Pacific/Auckland',
            'America/Toronto',
            'America/Mexico_City',
            'America/Sao_Paulo',
            'Africa/Cairo',
            'Africa/Johannesburg',
            'Asia/Istanbul',
            'Asia/Tehran',
            'Asia/Jakarta'
        ];

        let activeClocks = [];

        // Initialize timezone selector
        function initializeTimezoneSelector() {
            const select = document.getElementById('timezoneSelect');
            timezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                option.textContent = tz;
                select.appendChild(option);
            });
        }

        // Format time for a specific timezone
        function getTimeInTimezone(timezone) {
            const now = new Date();
            const timeString = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            }).format(now);

            const dateString = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            }).format(now);

            return { time: timeString, date: dateString };
        }

        // Get timezone offset
        function getTimezoneOffset(timezone) {
            const now = new Date();
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            const sign = offset >= 0 ? '+' : '';
            return `UTC ${sign}${offset.toFixed(1)}`;
        }

        // Create a clock card
        function createClockCard(timezone) {
            const { time, date } = getTimeInTimezone(timezone);
            const offset = getTimezoneOffset(timezone);

            const card = document.createElement('div');
            card.className = 'clock-card';
            card.innerHTML = `
                <div class="timezone-name">${timezone}</div>
                <div class="timezone-info">${offset}</div>
                <div class="digital-time" data-timezone="${timezone}">${time}</div>
                <div class="digital-date">${date}</div>
            `;

            card.onclick = () => removeTimezone(timezone);
            return card;
        }

        // Update all clocks
        function updateAllClocks() {
            const timeElements = document.querySelectorAll('[data-timezone]');
            timeElements.forEach(element => {
                const timezone = element.getAttribute('data-timezone');
                const { time } = getTimeInTimezone(timezone);
                element.textContent = time;
            });
            updateActiveTzList();
        }

        // Update active timezone list in sidebar
        function updateActiveTzList() {
            const list = document.getElementById('activeTzList');
            if (activeClocks.length === 0) {
                list.innerHTML = '<p style="color: #b0b0b0; font-size: 0.85rem;">No timezones added yet.</p>';
                return;
            }

            list.innerHTML = '';
            activeClocks.forEach(tz => {
                const { time } = getTimeInTimezone(tz);
                const item = document.createElement('div');
                item.className = 'timezone-item';
                item.innerHTML = `
                    <div style="flex: 1;">
                        <div style="font-weight: bold;">${tz.split('/')[1] || tz}</div>
                        <div style="font-size: 0.75rem; opacity: 0.8;">${time}</div>
                    </div>
                    <span class="remove" onclick="event.stopPropagation(); removeTimezone('${tz}')">✕</span>
                `;
                list.appendChild(item);
            });
        }

        // Add timezone to the display
        function addTimezone(timezone = null) {
            if (!timezone) {
                timezone = document.getElementById('timezoneSelect').value;
                if (!timezone) {
                    alert('Please select a timezone');
                    return;
                }
            }

            if (activeClocks.includes(timezone)) {
                alert('This timezone is already displayed');
                return;
            }

            activeClocks.push(timezone);
            localStorage.setItem('activeClocks', JSON.stringify(activeClocks));
            renderClocks();
            document.getElementById('timezoneSelect').value = '';
        }

        // Remove timezone
        function removeTimezone(timezone) {
            activeClocks = activeClocks.filter(tz => tz !== timezone);
            localStorage.setItem('activeClocks', JSON.stringify(activeClocks));
            renderClocks();
        }

        // Render all clocks
        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            if (activeClocks.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <h3>No Clocks Yet</h3>
                            <p>Add a timezone from the left panel to get started!</p>
                        </div>
                    </div>
                `;
                updateActiveTzList();
                return;
            }

            container.innerHTML = '';
            activeClocks.forEach(timezone => {
                container.appendChild(createClockCard(timezone));
            });
            updateActiveTzList();
        }

        // Add default clocks
        function addDefaultClocks() {
            activeClocks = [
                'UTC',
                'America/New_York',
                'Europe/London',
                'Asia/Tokyo',
                'Australia/Sydney',
                'Asia/Kolkata'
            ];
            localStorage.setItem('activeClocks', JSON.stringify(activeClocks));
            renderClocks();
        }

        // Clear all clocks
        function clearAllClocks() {
            if (confirm('Are you sure you want to clear all timezones?')) {
                activeClocks = [];
                localStorage.setItem('activeClocks', JSON.stringify(activeClocks));
                renderClocks();
            }
        }

        // Load from localStorage
        function loadActiveClocks() {
            const saved = localStorage.getItem('activeClocks');
            if (saved && JSON.parse(saved).length > 0) {
                activeClocks = JSON.parse(saved);
            } else {
                addDefaultClocks();
            }
            renderClocks();
        }

        // Navigation functions
        function scrollToTop() {
            document.querySelector('.main-content').scrollTop = 0;
        }

        function showAllClocks() {
            alert('All timezones are displayed. Use the sidebar to manage them!');
        }

        function showFavorites() {
            alert('Favorite feature coming soon!');
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initializeTimezoneSelector();
            loadActiveClocks();
            updateAllClocks();
            setInterval(updateAllClocks, 1000);
        });
    </script>
</body>
</html>
